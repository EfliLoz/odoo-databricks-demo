[options]

; ---------------------------------------------------------------------------
; Conexión a Postgres
;
; A propósito NO van acá db_host, db_port, db_user ni db_password.
; El entrypoint de la imagen oficial de Odoo inyecta esos cuatro parámetros
; como argumentos de línea de comando, pero SOLO si no aparecen en este
; archivo: si los declarás acá, el config file gana y las variables de
; entorno quedan ignoradas.
;
; Al dejarlos fuera, las credenciales viven en .env y este archivo se puede
; versionar sin secretos. Ver infra/docker-compose.yml (servicio `odoo`).
; ---------------------------------------------------------------------------

; Password maestro del gestor de bases. Con list_db = False el gestor web
; está apagado, así que este valor no expone nada por HTTP; aun así cambialo
; si la instancia sale de tu laptop.
admin_passwd = sandbox_cambiame

; Una sola base, fija. El gestor web queda apagado a propósito:
; la base se crea por CLI para que la demo data sea reproducible.
; Si cambiás el nombre, actualizá también ODOO_DB en .env.
db_name = demo
dbfilter = ^demo$
list_db = False

; Dev: un solo proceso, se puede poner breakpoints y leer logs sin ruido.
; En producción esto va en 2*núcleos+1 y se prende proxy_mode detrás de nginx.
workers = 0
max_cron_threads = 1
proxy_mode = False

; Timeouts holgados: la demo data y las instalaciones de módulos son lentas.
limit_time_real = 600
limit_time_cpu = 300

addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
log_level = info
